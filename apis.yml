name: Serchen
description: 'Serchen is a business-software marketplace and buyer review platform operated by Ketchell
  Ltd of Bournemouth, United Kingdom, trading as Serchen since 1997. It lists software products and IT
  service providers across hundreds of categories and industry hubs, collects and moderates first-hand
  buyer reviews, generates AI review summaries, and lets buyers compare products side by side. Vendors
  claim a free listing and can pay for Basic or Premium Membership, newsletter placement in Serchen Daily,
  category spotlights and guest posts. Serchen is a discovery and demand surface rather than a software
  vendor: it publishes no public API, SDK, webhook surface or developer portal, and its only machine-readable
  artifacts are a sitemap index and a robots.txt carrying Cloudflare Content-Signal directives.'
